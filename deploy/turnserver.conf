# RemoDesk Coturn STUN & TURN Relay Server Configuration

# Listening Ports
listening-port=3478
tls-listening-port=5349

# IP & Realm Configuration
realm=remodesk.net
server-name=remodesk.net

# RFC 5766 Shared Secret Time-Limited Ephemeral Authentication
use-auth-secret
static-auth-secret=remodesk-coturn-shared-secret

# Performance & Traversal Optimizations
fingerprint
lt-cred-mech
stale-nonce=600

# Relay IP Port Range (Allow 1000 ports for RTP relays)
min-port=49152
max-port=50152

# Security Hardening
no-multicast-peers
no-cli
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Logging
verbose
log-file=stdout
